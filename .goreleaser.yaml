version: 2

builds:
  - env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc

# A keyless Sigstore signature of the checksum file, made with the identity of the
# release workflow. The checksum file covers every archive.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args: [sign-blob, "--bundle=${signature}", "${artifact}", --yes]
    artifacts: checksum

# The formula goes to the shared tap, so users run one command: brew install albertovincenzi/tap/aiwatch
# shortcut: 'brews' is deprecated in favour of 'homebrew_casks'; same choice and reason as bignami.
brews:
  - name: aiwatch
    repository:
      owner: albertovincenzi
      name: homebrew-tap
      git:
        url: git@github.com:albertovincenzi/homebrew-tap.git
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}"
    directory: Formula
    homepage: https://github.com/albertovincenzi/aiwatch
    description: "A TUI to watch the CPU and memory of Claude, Codex and ChatGPT processes, and kill them"
    license: MIT
    commit_author:
      name: aiwatch-release
      email: 9381203+albertovincenzi@users.noreply.github.com
    test: |
      assert_match "aiwatch", shell_output("#{bin}/aiwatch --version")
